<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World War III Simulator</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Vazirmatn",sans-serif;
}

body{
    background:#050505;
    overflow:hidden;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,rgba(0,255,120,.08),transparent 60%),
    linear-gradient(rgba(0,255,100,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,100,.04) 1px,transparent 1px);
    background-size:100% 100%,40px 40px,40px 40px;
    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.logo{
    font-size:55px;
    margin-bottom:20px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{transform:scale(1.08);}
}

h1{
    font-size:48px;
    color:#00ff99;
    text-shadow:0 0 20px #00ff99;
    margin-bottom:15px;
}

h2{
    font-size:24px;
    margin-bottom:25px;
    color:#ddd;
}

p{
    max-width:700px;
    line-height:2;
    color:#aaa;
    font-size:18px;
}

.status{
    margin-top:40px;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:18px;
}

.dot{
    width:15px;
    height:15px;
    background:#00ff55;
    border-radius:50%;
    box-shadow:0 0 15px #00ff55;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:.3;
    }
}

footer{
    position:absolute;
    bottom:25px;
    color:#666;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">🌍</div>

<h1>World War III Simulator</h1>

<h2>بازی در حال بروزرسانی است</h2>

<p>
فرمانده،
در حال آماده‌سازی نسخه جدید بازی هستیم.
ویژگی‌های جدید، بهبود عملکرد سرورها و سیستم‌های مدیریت کشور
در حال پیاده‌سازی هستند.
به‌زودی با امکاناتی قدرتمندتر بازخواهیم گشت...
</p>

<div class="status">
<div class="dot"></div>
در حال بروزرسانی سرورها...
</div>

<footer>
© 2026 World War III Simulator
</footer>

</div>

</body>
</html>
